<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astro Clock Dashboard</title>
    <style>
        :root {
            /* Dynamic theme color - defaults to red */
            --theme-color: #ff0000;
            --label-color: #880000;
            --border-color: #330000;
        }

        /* Mode class applied when the sun is above the horizon */
        body.sun-up {
            --theme-color: #00ff00;
            --label-color: #008800;
            --border-color: #003300;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Guarantees no scrollbars */
        }

        body {
            background-color: #000000;
            color: var(--theme-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5vh 2vw;
            transition: color 0.5s ease;
        }

        /* Dashboard Container Wrapper */
        .dashboard-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            max-height: 100vh;
            justify-content: center;
        }

        /* Top Section Setup */
        .top-section {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-bottom: 2vh;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5vh;
            transition: border-color 0.5s ease;
            gap: 1vh;
        }

        .top-row-1 {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .top-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
        }

        .clock-box {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: center;
        }

        .label {
            font-size: clamp(0.6rem, 1.2vw, 1rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--label-color);
            margin-bottom: 0.2vh;
            transition: color 0.5s ease;
        }

        .top-section .clock-box .label {
            font-size: clamp(0.75rem, 1.6vw, 1.3rem);
        }

        .time-lct, .time-utc {
            font-size: clamp(1.8rem, 4.2vw, 3.8rem);
            font-weight: bold;
            line-height: 1;
        }

        .time-lst {
            font-size: clamp(2.5rem, 6.5vw, 5.8rem);
            font-weight: bold;
            line-height: 1;
        }

        /* Main Grid Container for All 4 Columns */
        .columns-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            column-gap: 0;
            width: 100%;
            align-items: flex-start;
        }

        /* Column Gap Scaling */
        .columns-container > :nth-child(1) { margin-right: 0.8vw; }
        .columns-container > :nth-child(2) { margin-left: 0.8vw; margin-right: 0.6vw; }
        .columns-container > :nth-child(3) { margin-left: 0.6vw; margin-right: 0.3vw; }
        .columns-container > :nth-child(4) { margin-left: 0.3vw; }

        .symbol-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            align-self: flex-start;
            padding-top: 0.5vh;
            text-align: center;
        }

        .astro-symbol {
            color: var(--theme-color);
            user-select: none;
            line-height: 1;
            transition: color 0.5s ease;
        }

        .sun-symbol, .moon-symbol {
            font-size: clamp(2.8rem, 6.5vw, 6.2rem);
        }

        .symbol-subtext {
            font-size: clamp(0.75rem, 1.4vw, 1.1rem);
            font-weight: bold;
            margin-top: 0.5vh;
            color: var(--theme-color);
            transition: color 0.5s ease;
            white-space: nowrap;
            text-align: center;
        }

        .info-box {
            display: flex;
            flex-direction: column;
            margin-top: 1vh;
            gap: 0.5vh;
            align-items: center;
            text-align: center;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .info-label {
            font-size: clamp(0.5rem, 0.9vw, 0.75rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--label-color);
            transition: color 0.5s ease;
        }

        .info-value {
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            font-weight: bold;
            color: var(--theme-color);
            transition: color 0.5s ease;
            white-space: nowrap;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 1.8vh;
            font-size: clamp(1.4rem, 3.2vw, 2.8rem);
            font-weight: bold;
            text-align: center;
        }

        .data-point {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-value {
            line-height: 1.1;
        }

        .moon-phase-value {
            font-size: clamp(1.3rem, 3vw, 2.6rem);
            line-height: 1.1;
            white-space: nowrap;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 1vh 1vw;
            }
            .top-section {
                margin-bottom: 1.2vh;
                padding-bottom: 1vh;
                gap: 0.5vh;
            }
            .column {
                gap: 1vh;
            }
            .info-box {
                margin-top: 0.5vh;
                gap: 0.2vh;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Top Clocks Section -->
        <div class="top-section">
            <!-- Row 1: Sidereal Time Centered -->
            <div class="top-row-1">
                <div class="clock-box">
                    <span class="label">Local Sidereal Time</span>
                    <span class="time-lst" id="lst">--:--:--</span>
                </div>
            </div>
            <!-- Row 2: UTC (Left Two Columns) & Local Civil Time (Right Two Columns) -->
            <div class="top-row-2">
                <div class="clock-box">
                    <span class="label">UTC</span>
                    <span class="time-utc" id="utc">--:--:--</span>
                </div>
                <div class="clock-box">
                    <span class="label">Local Civil Time</span>
                    <span class="time-lct" id="lct">--:--:--</span>
                </div>
            </div>
        </div>

        <!-- Main 4-Column Layout Container -->
        <div class="columns-container">
            <!-- Column 1: Sun Symbol & Extra Astro Times -->
            <div class="symbol-wrapper left">
                <div class="astro-symbol sun-symbol" title="Solar Column">&#9728;</div>
                <div class="symbol-subtext" id="sun-elevation">Elev: --.-°</div>
                <div class="info-box">
                    <div class="info-item">
                        <span class="info-label">Next Astro Dawn</span>
                        <span class="info-value" id="astro-start">--:--</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Next Astro Dusk</span>
                        <span class="info-value" id="astro-end">--:--</span>
                    </div>
                </div>
            </div>

            <!-- Column 2: Sun Data Times -->
            <div class="column">
                <div class="data-point">
                    <span class="label">Next Sunrise</span>
                    <span class="data-value" id="sunrise">--:--</span>
                </div>
                <div class="data-point">
                    <span class="label">Local Solar Time</span>
                    <span class="data-value" id="solar-time">--:--:--</span>
                </div>
                <div class="data-point">
                    <span class="label">Next Sunset</span>
                    <span class="data-value" id="sunset">--:--</span>
                </div>
            </div>

            <!-- Column 3: Moon Data Times -->
            <div class="column">
                <div class="data-point">
                    <span class="label">Next Moonrise</span>
                    <span class="data-value" id="moonrise">--:--</span>
                </div>
                <div class="data-point">
                    <span class="label">Moon Illumination</span>
                    <span class="moon-phase-value" id="moon-phase">--</span>
                </div>
                <div class="data-point">
                    <span class="label">Next Moonset</span>
                    <span class="data-value" id="moonset">--:--</span>
                </div>
            </div>

            <!-- Column 4: Moon Symbol & Location Coordinates -->
            <div class="symbol-wrapper right">
                <div class="astro-symbol moon-symbol" id="moon-symbol" title="Lunar Column">&#9790;</div>
                <div class="info-box">
                    <div class="info-item">
                        <span class="info-label">Latitude</span>
                        <span class="info-value" id="latitude-val">--.-° N</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Longitude</span>
                        <span class="info-value" id="longitude-val">--.-° W</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let userLat = 0;
        let userLon = 0;
        let hasLocation = false;

        const RAD = Math.PI / 180;
        const DEG = 180 / Math.PI;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    hasLocation = true;
                    updateAstroData();
                    updateCoordinates();
                },
                (err) => console.log("Location access denied."),
                { timeout: 10000 }
            );
        }

        function updateCoordinates() {
            if (!hasLocation) return;
            
            const latDir = userLat >= 0 ? 'N' : 'S';
            const lonDir = userLon >= 0 ? 'E' : 'W';
            const absLat = Math.abs(userLat).toFixed(4);
            const absLon = Math.abs(userLon).toFixed(4);

            document.getElementById('latitude-val').textContent = `${absLat}° ${latDir}`;
            document.getElementById('longitude-val').textContent = `${absLon}° ${lonDir}`;
        }

        function pad(num, size = 2) {
            let s = "00" + Math.floor(num);
            return s.substr(s.length - size);
        }

        function formatHMS(hours) {
            hours = (hours + 24) % 24;
            const h = Math.floor(hours);
            const m = Math.floor((hours - h) * 60);
            const s = Math.floor((((hours - h) * 60) - m) * 60);
            return `${pad(h)}:${pad(m)}:${pad(s)}`;
        }

        function getJulianDate(now) {
            return (now.getTime() / 86400000) + 2440587.5;
        }

        function getGMST(now) {
            const jd = getJulianDate(now);
            const d = jd - 2451545.0;
            let gmst = 18.697374558 + 24.06570982441908 * d;
            return (gmst % 24 + 24) % 24;
        }

        function getLST(now, lon) {
            const gmst = getGMST(now);
            const lst = gmst + (lon / 15.0);
            return (lst % 24 + 24) % 24;
        }

        /* --- HIGH-PRECISION NOAA / MEEUS SOLAR POSITION & EVENT ENGINE --- */

        function getNOAASolarDetails(date) {
            const jd = getJulianDate(date);
            const jc = (jd - 2451545.0) / 36525.0;

            // Geometric Mean Longitude of Sun (degrees)
            let L0 = 280.46646 + jc * (36000.76983 + jc * 0.0003032);
            L0 = (L0 % 360 + 360) % 360;

            // Mean Anomaly of Sun (degrees)
            const M = 357.52911 + jc * (35999.05029 - 0.0001537 * jc);
            const mRad = M * RAD;

            // Eccentricity of Earth's Orbit
            const e = 0.016708634 - jc * (0.000042037 + 0.0000001267 * jc);

            // Sun Equation of Center
            const C = Math.sin(mRad) * (1.914602 - jc * (0.004817 + 0.000014 * jc)) +
                      Math.sin(2 * mRad) * (0.019993 - 0.000101 * jc) +
                      Math.sin(3 * mRad) * 0.000289;

            // Sun True Longitude & Apparent Longitude (degrees)
            const sunTrueLong = L0 + C;
            const omega = 125.04 - 1934.136 * jc;
            const lambda = sunTrueLong - 0.00569 - 0.00478 * Math.sin(omega * RAD);

            // Mean Obliquity of the Ecliptic (degrees)
            const seconds = 21.448 - jc * (46.8150 + jc * (0.00059 - jc * 0.001813));
            const obqMean = 23.0 + (26.0 + seconds / 60.0) / 60.0;
            const obqCorr = obqMean + 0.00256 * Math.cos(omega * RAD);

            // Sun Declination (radians)
            const declination = Math.asin(Math.sin(obqCorr * RAD) * Math.sin(lambda * RAD));

            // Equation of Time (minutes)
            const y = Math.tan((obqCorr / 2.0) * RAD) * Math.tan((obqCorr / 2.0) * RAD);
            const l0Rad = L0 * RAD;
            const eqTime = 4.0 * DEG * (
                y * Math.sin(2.0 * l0Rad) -
                2.0 * e * Math.sin(mRad) +
                4.0 * e * y * Math.sin(mRad) * Math.cos(2.0 * l0Rad) -
                0.5 * y * y * Math.sin(4.0 * l0Rad) -
                1.25 * e * e * Math.sin(2.0 * mRad)
            );

            return { eqTime, declination };
        }

        function getLocalSolarTime(now, lon) {
            const { eqTime } = getNOAASolarDetails(now);
            const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
            // Apparent Solar Time = UTC + Longitude offset + Equation of Time
            const solarTime = utcHours + (lon / 15.0) + (eqTime / 60.0);
            return (solarTime % 24 + 24) % 24;
        }

        function getCurrentSolarElevation(now, lat, lng) {
            if (!hasLocation) return null;
            const { eqTime, declination } = getNOAASolarDetails(now);
            const latRad = lat * RAD;

            const utcMinutes = now.getUTCHours() * 60 + now.getUTCMinutes() + now.getUTCSeconds() / 60 + now.getUTCMilliseconds() / 60000;
            const trueSolarTime = utcMinutes + eqTime + (4.0 * lng);
            const ha = ((trueSolarTime / 4.0) - 180.0) * RAD;

            const sinElevation = Math.sin(latRad) * Math.sin(declination) +
                                 Math.cos(latRad) * Math.cos(declination) * Math.cos(ha);

            const geoElevation = Math.asin(Math.max(-1, Math.min(1, sinElevation))) * DEG;

            // Atmospheric Refraction Correction
            let refraction = 0;
            if (geoElevation > -0.85) {
                const te = Math.tan((geoElevation + 10.3 / (geoElevation + 5.11)) * RAD);
                refraction = 1.02 / te / 60.0; // degrees
            }

            return geoElevation + refraction;
        }

        function getSolarEventAltitudeDiff(date, lat, lng, targetZenithAngle) {
            const { eqTime, declination } = getNOAASolarDetails(date);
            const latRad = lat * RAD;

            const utcMinutes = date.getUTCHours() * 60 + date.getUTCMinutes() + date.getUTCSeconds() / 60 + date.getUTCMilliseconds() / 60000;
            const trueSolarTime = utcMinutes + eqTime + (4.0 * lng);
            const ha = ((trueSolarTime / 4.0) - 180.0) * RAD;

            const cosZenith = Math.sin(latRad) * Math.sin(declination) +
                              Math.cos(latRad) * Math.cos(declination) * Math.cos(ha);
            const zenith = Math.acos(Math.max(-1, Math.min(1, cosZenith))) * DEG;

            return zenith - targetZenithAngle;
        }

        function getNextSolarEventPrecise(fromDate, lat, lng, targetZenithAngle, targetIsRise) {
            if (!hasLocation) return null;

            let t0 = new Date(fromDate.getTime());
            let diff0 = getSolarEventAltitudeDiff(t0, lat, lng, targetZenithAngle);

            const stepMinutes = 15;
            const maxSteps = (36 * 60) / stepMinutes; // Search ahead up to 36 hours

            for (let i = 1; i <= maxSteps; i++) {
                let t1 = new Date(fromDate.getTime() + i * stepMinutes * 60 * 1000);
                let diff1 = getSolarEventAltitudeDiff(t1, lat, lng, targetZenithAngle);

                // Crossing detected
                const isRise = diff0 > 0 && diff1 <= 0;
                const isSet = diff0 <= 0 && diff1 > 0;

                if ((targetIsRise && isRise) || (!targetIsRise && isSet)) {
                    // Refine exact zenith crossing with binary search (bisection)
                    let low = t0.getTime();
                    let high = t1.getTime();
                    let midTime = low;

                    for (let step = 0; step < 10; step++) {
                        midTime = (low + high) / 2;
                        let midDiff = getSolarEventAltitudeDiff(new Date(midTime), lat, lng, targetZenithAngle);

                        if (targetIsRise) {
                            if (midDiff > 0) low = midTime;
                            else high = midTime;
                        } else {
                            if (midDiff <= 0) low = midTime;
                            else high = midTime;
                        }
                    }

                    const eventTime = new Date(midTime);
                    
                    // Round time to nearest minute for display
                    if (eventTime.getSeconds() >= 30) {
                        eventTime.setMinutes(eventTime.getMinutes() + 1);
                    }

                    return eventTime;
                }

                t0 = t1;
                diff0 = diff1;
            }

            return null;
        }

        function getNextSunriseAndSunset(now, lat, lng) {
            if (!hasLocation) return { sunrise: null, sunset: null };

            // Official Solar Horizon Zenith Angle = 90° 50' = 90.8333° (includes atmospheric refraction & semi-diameter)
            const sunrise = getNextSolarEventPrecise(now, lat, lng, 90.8333, true);
            const sunset = getNextSolarEventPrecise(now, lat, lng, 90.8333, false);

            return { sunrise, sunset };
        }

        function getNextAstroTwilightEvents(now, lat, lng) {
            if (!hasLocation) return { start: null, end: null };

            // Astronomical Twilight Zenith Angle = 108° (-18° elevation)
            const astroStart = getNextSolarEventPrecise(now, lat, lng, 108.0, true);
            const astroEnd = getNextSolarEventPrecise(now, lat, lng, 108.0, false);

            return { start: astroStart, end: astroEnd };
        }

        function checkSunPosition(now) {
            if (!hasLocation) return;
            const elevation = getCurrentSolarElevation(now, userLat, userLon);
            if (elevation !== null && elevation > 0) {
                document.body.classList.add('sun-up');
            } else {
                document.body.classList.remove('sun-up');
            }
        }

        /* --- HIGH-PRECISION MOON POSITION & EVENT ENGINE (MEEUS PERTURBATION MODEL) --- */

        function getMoonPositionDetailed(date) {
            const d = (date.getTime() / 86400000) - 10957.5; // Days since J2000.0

            // Mean elements of the Moon's orbit
            const L = (218.3164477 + 13.17639647 * d) % 360; // Mean longitude
            const M = (134.9633964 + 13.06499295 * d) % 360; // Moon mean anomaly
            const F = (93.2720950 + 13.22935026 * d) % 360;  // Mean distance from node
            const D = (297.8501921 + 12.19074912 * d) % 360; // Mean elongation
            const SunM = (357.5291092 + 0.98560028 * d) % 360; // Sun mean anomaly

            const mRad = M * RAD;
            const fRad = F * RAD;
            const dRad = D * RAD;
            const smRad = SunM * RAD;

            // Longitude perturbations (Evection, Variation, Annual Eq, etc.)
            let l = L + 
                6.288750 * Math.sin(mRad) +
                1.274027 * Math.sin(2 * dRad - mRad) +
                0.658314 * Math.sin(2 * dRad) +
                0.213618 * Math.sin(2 * mRad) -
                0.185116 * Math.sin(smRad) -
                0.114332 * Math.sin(2 * fRad) +
                0.058793 * Math.sin(2 * dRad - 2 * mRad) +
                0.057066 * Math.sin(2 * dRad - smRad - mRad) +
                0.053322 * Math.sin(2 * dRad + mRad) +
                0.045758 * Math.sin(2 * dRad - smRad);

            // Latitude perturbations
            let b = 5.128122 * Math.sin(fRad) +
                0.280606 * Math.sin(mRad + fRad) +
                0.277693 * Math.sin(mRad - fRad) +
                0.173237 * Math.sin(2 * dRad - fRad) +
                0.055413 * Math.sin(2 * dRad - mRad + fRad) +
                0.046271 * Math.sin(2 * dRad - mRad - fRad);

            // Horizontal Parallax (HP) in degrees
            const hp = 0.9507 + 0.0518 * Math.cos(mRad) + 0.0095 * Math.cos(2 * dRad - mRad) + 0.0078 * Math.cos(2 * dRad);

            const eRad = (23.439 - 0.0000004 * d) * RAD;
            const lRad = l * RAD;
            const bRad = b * RAD;

            const x = Math.cos(bRad) * Math.cos(lRad);
            const y = Math.cos(bRad) * Math.sin(lRad) * Math.cos(eRad) - Math.sin(bRad) * Math.sin(eRad);
            const z = Math.cos(bRad) * Math.sin(lRad) * Math.sin(eRad) + Math.sin(bRad) * Math.cos(eRad);

            let ra = Math.atan2(y, x) * DEG;
            if (ra < 0) ra += 360;
            const dec = Math.asin(z) * DEG;

            return { ra, dec, hp };
        }

        function getMoonIlluminationData(now) {
            const d = (now.getTime() / 86400000) - 10957.5;

            const sunL = (280.460 + 0.9856474 * d) % 360;
            const sunM = ((357.528 + 0.9856003 * d) % 360) * RAD;
            const sunLambda = (sunL + 1.915 * Math.sin(sunM) + 0.020 * Math.sin(2 * sunM)) * RAD;
            const eRad = (23.439 - 0.0000004 * d) * RAD;

            const sunRA = Math.atan2(Math.cos(eRad) * Math.sin(sunLambda), Math.cos(sunLambda));
            const sunDec = Math.asin(Math.sin(eRad) * Math.sin(sunLambda));

            const moonPos = getMoonPositionDetailed(now);
            const moonRA = moonPos.ra * RAD;
            const moonDec = moonPos.dec * RAD;

            const cosElongation = Math.sin(sunDec) * Math.sin(moonDec) + 
                                  Math.cos(sunDec) * Math.cos(moonDec) * Math.cos(sunRA - moonRA);
            const elongation = Math.acos(Math.max(-1, Math.min(1, cosElongation)));

            const phi = Math.atan2(149600000 * Math.sin(elongation), 384000 - 149600000 * Math.cos(elongation));
            const k = (1 + Math.cos(phi)) / 2;

            const percent = Math.round(k * 100);

            let moonLng = (moonPos.ra) % 360;
            let sunLng = (sunRA * DEG) % 360;
            let diff = (moonLng - sunLng + 360) % 360;
            const isWaxing = diff < 180;
            const sign = isWaxing ? "+" : "-";

            return `${sign}${percent}%`;
        }

        // Topocentric Apparent Elevation relative to atmospheric horizon
        function getMoonApparentAltitude(date, lat, lon) {
            const pos = getMoonPositionDetailed(date);
            const lst = getLST(date, lon) * 15;
            let ha = (lst - pos.ra + 360) % 360;

            const latRad = lat * RAD;
            const decRad = pos.dec * RAD;
            const haRad = ha * RAD;

            const sinGeocentricAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(haRad);
            const geoAlt = Math.asin(sinGeocentricAlt) * DEG;

            // Topocentric correction incorporating dynamic horizontal parallax (HP)
            const topocentricAlt = geoAlt - pos.hp * Math.cos(geoAlt * RAD);

            // Target altitude for top-limb moon contact: atmospheric refraction (-0.5667°) minus semi-diameter
            const semiDiameter = 0.2724 * pos.hp;
            const targetHorizonAlt = -0.5667 - semiDiameter;

            return topocentricAlt - targetHorizonAlt;
        }

        function getNextMoonEvent(fromDate, lat, lon, targetIsRise) {
            if (!hasLocation) return "--:--";

            let t0 = new Date(fromDate.getTime());
            let alt0 = getMoonApparentAltitude(t0, lat, lon);

            const stepMinutes = 30;
            const maxSteps = (36 * 60) / stepMinutes;

            for (let i = 1; i <= maxSteps; i++) {
                let t1 = new Date(fromDate.getTime() + i * stepMinutes * 60 * 1000);
                let alt1 = getMoonApparentAltitude(t1, lat, lon);

                const isRise = alt0 < 0 && alt1 >= 0;
                const isSet = alt0 >= 0 && alt1 < 0;

                if ((targetIsRise && isRise) || (!targetIsRise && isSet)) {
                    let low = t0.getTime();
                    let high = t1.getTime();
                    let midTime = low;

                    for (let step = 0; step < 8; step++) {
                        midTime = (low + high) / 2;
                        let midAlt = getMoonApparentAltitude(new Date(midTime), lat, lon);

                        if (targetIsRise) {
                            if (midAlt < 0) low = midTime;
                            else high = midTime;
                        } else {
                            if (midAlt >= 0) low = midTime;
                            else high = midTime;
                        }
                    }

                    const eventTime = new Date(midTime);
                    
                    if (eventTime.getSeconds() >= 30) {
                        eventTime.setMinutes(eventTime.getMinutes() + 1);
                    }

                    return `${pad(eventTime.getHours())}:${pad(eventTime.getMinutes())}`;
                }

                t0 = t1;
                alt0 = alt1;
            }

            return "--:--";
        }

        function updateClocks() {
            const now = new Date();

            document.getElementById('lct').textContent = 
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            document.getElementById('utc').textContent = 
                `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())}`;

            const lstHours = getLST(now, userLon);
            document.getElementById('lst').textContent = formatHMS(lstHours);

            const solarHours = getLocalSolarTime(now, userLon);
            document.getElementById('solar-time').textContent = formatHMS(solarHours);

            if (hasLocation) {
                const elevation = getCurrentSolarElevation(now, userLat, userLon);
                if (elevation !== null) {
                    const formattedElev = `${elevation >= 0 ? '+' : ''}${elevation.toFixed(1)}°`;
                    document.getElementById('sun-elevation').textContent = `Elev: ${formattedElev}`;
                }
            }

            checkSunPosition(now);
        }

        function updateAstroData() {
            const now = new Date();
            
            const { sunrise, sunset } = getNextSunriseAndSunset(now, userLat, userLon);
            document.getElementById('sunrise').textContent = sunrise ? `${pad(sunrise.getHours())}:${pad(sunrise.getMinutes())}` : "N/A";
            document.getElementById('sunset').textContent = sunset ? `${pad(sunset.getHours())}:${pad(sunset.getMinutes())}` : "N/A";
            
            const { start, end } = getNextAstroTwilightEvents(now, userLat, userLon);
            document.getElementById('astro-start').textContent = start ? `${pad(start.getHours())}:${pad(start.getMinutes())}` : "N/A";
            document.getElementById('astro-end').textContent = end ? `${pad(end.getHours())}:${pad(end.getMinutes())}` : "N/A";

            document.getElementById('moon-phase').textContent = getMoonIlluminationData(now);

            document.getElementById('moonrise').textContent = getNextMoonEvent(now, userLat, userLon, true);
            document.getElementById('moonset').textContent = getNextMoonEvent(now, userLat, userLon, false);
        }

        setInterval(updateClocks, 1000);
        setInterval(updateAstroData, 60000);
        updateClocks();
        updateAstroData();
    </script>
</body>
</html>
