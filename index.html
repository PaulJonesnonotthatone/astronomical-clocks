<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Clock Dashboard</title>
    <style>
        :root {
            /* Dynamic theme color - defaults to red */
            --theme-color: #ff0000;
            --label-color: #880000;
            --border-color: #330000;
        }

        /* Mode class applied when the sun is above the horizon */
        body.sun-up {
            --theme-color: #00ff00;
            --label-color: #008800;
            --border-color: #003300;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: var(--theme-color);
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            align-items: center;
            transition: color 0.5s ease;
        }

        /* Top Row Setup - Labels & Clocks Centered Individually */
        .top-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: end; 
            width: 100%;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            transition: border-color 0.5s ease;
        }

        .clock-box {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-align: center;
        }

        .label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--label-color);
            margin-bottom: 0.25rem;
            transition: color 0.5s ease;
        }

        .time-lct, .time-utc {
            font-size: 4rem;
            font-weight: bold;
            line-height: 1;
        }

        .time-lst {
            font-size: 6rem;
            font-weight: bold;
            line-height: 1;
        }

        /* Main Container for Columns with Icons */
        .columns-container {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            width: 100%;
            max-width: 1000px;
        }

        .symbol-wrapper {
            flex: 1;
            display: flex;
            align-self: flex-start;
            padding-top: 0.5rem;
        }

        .symbol-wrapper.left {
            justify-content: flex-start;
            padding-left: 2rem;
        }

        .symbol-wrapper.right {
            justify-content: flex-end;
            padding-right: 2rem;
        }

        /* Base Astro Symbol Style */
        .astro-symbol {
            color: var(--theme-color);
            user-select: none;
            line-height: 1;
            transition: color 0.5s ease;
        }

        .sun-symbol {
            font-size: 6.65rem;
        }

        /* Static Moon Symbol matching theme color */
        .moon-symbol {
            font-size: 6.65rem;
        }

        /* Two Columns Setup - Moved 15% closer to edges */
        .main-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
        }

        .data-point {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .data-value {
            line-height: 1.1;
        }

        /* Moon Phase: 2.85rem single line */
        .moon-phase-value {
            font-size: 2.85rem;
            line-height: 1.1;
            white-space: nowrap;
        }

        /* Latitude/Longitude row - Gap reduced by 25% */
        .coordinates-row {
            margin-top: 1.875rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Coordinates: 1.44rem */
        .lat-long-value {
            font-size: 1.44rem;
            font-weight: bold;
            line-height: 1.1;
            color: var(--theme-color);
            transition: color 0.5s ease;
        }

        /* Responsive scaling for mobile devices */
        @media (max-width: 900px) {
            .top-row {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .time-lst { font-size: 4.5rem; }
            .time-lct, .time-utc { font-size: 3rem; }
            
            @media (max-width: 600px) {
                .main-columns {
                    grid-template-columns: 1fr;
                }
            }
            
            .column { font-size: 2.2rem; }
            .moon-phase-value { font-size: 1.8rem; }
            .lat-long-value { font-size: 1.15rem; }
            .sun-symbol, .moon-symbol { font-size: 4rem; }
            .symbol-wrapper.left { padding-left: 0.5rem; }
            .symbol-wrapper.right { padding-right: 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- Top Row -->
    <div class="top-row">
        <div class="clock-box">
            <span class="label">Local Civil Time</span>
            <span class="time-lct" id="lct">--:--:--</span>
        </div>
        <div class="clock-box">
            <span class="label">Local Sidereal Time</span>
            <span class="time-lst" id="lst">--:--:--</span>
        </div>
        <div class="clock-box">
            <span class="label">UTC</span>
            <span class="time-utc" id="utc">--:--:--</span>
        </div>
    </div>

    <!-- Main Section with Sun/Moon Icons -->
    <div class="columns-container">
        <!-- Sun Symbol to the far left -->
        <div class="symbol-wrapper left">
            <div class="astro-symbol sun-symbol" title="Solar Column">&#9728;</div>
        </div>

        <!-- Main Two Columns -->
        <div class="main-columns">
            <!-- Sun Column -->
            <div class="column">
                <div class="data-point">
                    <span class="label">Next Sunrise</span>
                    <span class="data-value" id="sunrise">--:--</span>
                </div>
                <div class="data-point">
                    <span class="label">Local Solar Time</span>
                    <span class="data-value" id="solar-time">--:--:--</span>
                </div>
                <div class="data-point">
                    <span class="label">Next Sunset</span>
                    <span class="data-value" id="sunset">--:--</span>
                </div>
            </div>

            <!-- Moon Column -->
            <div class="column">
                <div class="data-point">
                    <span class="label">Next Moonrise</span>
                    <span class="data-value" id="moonrise">--:--</span>
                </div>
                <div class="data-point">
                    <span class="label">Current Moon Phase</span>
                    <span class="moon-phase-value" id="moon-phase">--</span>
                </div>
                <div class="data-point">
                    <span class="label">Next Moonset</span>
                    <span class="data-value" id="moonset">--:--</span>
                </div>
            </div>
        </div>

        <!-- Static Crescent Moon Symbol to the far right -->
        <div class="symbol-wrapper right">
            <div class="astro-symbol moon-symbol" id="moon-symbol" title="Lunar Column">&#9790;</div>
        </div>
    </div>

    <!-- Centered Latitude & Longitude below columns -->
    <div class="coordinates-row">
        <span class="label">Latitude / Longitude</span>
        <span class="lat-long-value" id="coordinates">--° N, --° W</span>
    </div>

    <script>
        let userLat = 0;
        let userLon = 0;
        let hasLocation = false;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    hasLocation = true;
                    updateAstroData();
                    updateCoordinates();
                },
                (err) => console.log("Location access denied. Using UTC coordinates."),
                { timeout: 10000 }
            );
        }

        function updateCoordinates() {
            if (!hasLocation) return;
            
            const latDir = userLat >= 0 ? 'N' : 'S';
            const lonDir = userLon >= 0 ? 'E' : 'W';
            const absLat = Math.abs(userLat).toFixed(4);
            const absLon = Math.abs(userLon).toFixed(4);

            document.getElementById('coordinates').textContent = 
                `${absLat}° ${latDir}, ${absLon}° ${lonDir}`;
        }

        function pad(num, size = 2) {
            let s = "00" + Math.floor(num);
            return s.substr(s.length - size);
        }

        function formatHMS(hours) {
            hours = (hours + 24) % 24;
            const h = Math.floor(hours);
            const m = Math.floor((hours - h) * 60);
            const s = Math.floor((((hours - h) * 60) - m) * 60);
            return `${pad(h)}:${pad(m)}:${pad(s)}`;
        }

        function formatHM(hours) {
            hours = (hours + 24) % 24;
            const h = Math.floor(hours);
            const m = Math.floor((hours - h) * 60);
            return `${pad(h)}:${pad(m)}`;
        }

        function getJulianDate(now) {
            return (now.getTime() / 86400000) + 2440587.5;
        }

        function getGMST(now) {
            const jd = getJulianDate(now);
            const d = jd - 2451545.0;
            let gmst = 18.697374558 + 24.06570982441908 * d;
            return (gmst % 24 + 24) % 24;
        }

        function getLST(now, lon) {
            const gmst = getGMST(now);
            const lst = gmst + (lon / 15.0);
            return (lst % 24 + 24) % 24;
        }

        function getEquationOfTime(now) {
            const jd = getJulianDate(now);
            const d = jd - 2451545.0;
            const g = (357.529 + 0.98560028 * d) % 360 * Math.PI / 180;
            const q = (280.459 + 0.98564736 * d) % 360;
            const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) % 360 * Math.PI / 180;
            const e = 23.439 - 0.0000004 * d;
            const RA = Math.atan2(Math.cos(e * Math.PI / 180) * Math.sin(L), Math.cos(L)) * 180 / Math.PI / 15;
            return (q / 15) - ((RA % 24 + 24) % 24);
        }

        function getLocalSolarTime(now, lon) {
            const utcHours = now.getUTCHours() + now.getUTCMinutes()/60 + now.getUTCSeconds()/3600;
            const eot = getEquationOfTime(now);
            const solarTime = utcHours + (lon / 15.0) + eot;
            return (solarTime % 24 + 24) % 24;
        }

        function getSunTimesDecimal(now, lat, lon) {
            if (!hasLocation) return { rise: null, set: null };
            const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
            const zenith = 90.833 * Math.PI / 180;
            const latRad = lat * Math.PI / 180;
            const lngHour = lon / 15;

            function calcTime(isRise) {
                const t = dayOfYear + ((isRise ? 6 : 18) - lngHour) / 24;
                const M = (0.9856 * t) - 3.289;
                let L = M + (1.916 * Math.sin(M * Math.PI / 180)) + (0.020 * Math.sin(2 * M * Math.PI / 180)) + 282.634;
                L = (L % 360 + 360) % 360;
                
                let RA = Math.atan(0.91764 * Math.tan(L * Math.PI / 180)) * 180 / Math.PI;
                RA = (RA % 360 + 360) % 360;
                RA = RA + (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90);
                RA = RA / 15;

                const sinDec = 0.39782 * Math.sin(L * Math.PI / 180);
                const cosDec = Math.cos(Math.asin(sinDec));
                const cosH = (Math.cos(zenith) - (sinDec * Math.sin(latRad))) / (cosDec * Math.cos(latRad));

                if (cosH > 1 || cosH < -1) return null;

                let H = isRise ? 360 - Math.acos(cosH) * 180 / Math.PI : Math.acos(cosH) * 180 / Math.PI;
                H = H / 15;

                const T = H + RA - (0.06571 * t) - 6.622;
                let UT = T - lngHour;
                UT = (UT % 24 + 24) % 24;

                const localOffset = -now.getTimezoneOffset() / 60;
                return (UT + localOffset + 24) % 24;
            }

            return { rise: calcTime(true), set: calcTime(false) };
        }

        function getSunRiseSet(now, lat, lon, isRise) {
            const times = getSunTimesDecimal(now, lat, lon);
            const time = isRise ? times.rise : times.set;
            return time !== null ? formatHM(time) : "N/A";
        }

        function checkSunPosition(now) {
            if (!hasLocation) return;

            const sunTimes = getSunTimesDecimal(now, userLat, userLon);
            if (sunTimes.rise === null || sunTimes.set === null) return;

            const currentDecimalHour = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
            const isSunUp = currentDecimalHour >= sunTimes.rise && currentDecimalHour < sunTimes.set;

            if (isSunUp) {
                document.body.classList.add('sun-up');
            } else {
                document.body.classList.remove('sun-up');
            }
        }

        function getMoonPhaseData(now) {
            const jd = getJulianDate(now);
            const daysSinceNew = (jd - 2451549.5) % 29.53058867;
            const age = (daysSinceNew + 29.53058867) % 29.53058867;

            if (age < 1.84566) return { name: "New Moon" };
            if (age < 5.53699) return { name: "Waxing Crescent" };
            if (age < 9.22831) return { name: "First Quarter" };
            if (age < 12.91963) return { name: "Waxing Gibbous" };
            if (age < 16.61096) return { name: "Full Moon" };
            if (age < 20.30228) return { name: "Waning Gibbous" };
            if (age < 23.99361) return { name: "Third Quarter" };
            if (age < 27.68493) return { name: "Waning Crescent" };
            return { name: "New Moon" };
        }

        function getMoonRiseSet(now, isRise) {
            if (!hasLocation) return "--:--";
            const jd = getJulianDate(now);
            const lunarAge = ((jd - 2451549.5) % 29.53058867 + 29.53058867) % 29.53058867;
            const moonOffsetHours = (lunarAge / 29.53058867) * 24;

            const baseTime = isRise ? 6 : 18;
            const approxLocalTime = (baseTime + moonOffsetHours) % 24;

            return formatHM(approxLocalTime);
        }

        function updateClocks() {
            const now = new Date();

            document.getElementById('lct').textContent = 
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            document.getElementById('utc').textContent = 
                `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())}`;

            const lstHours = getLST(now, userLon);
            document.getElementById('lst').textContent = formatHMS(lstHours);

            const solarHours = getLocalSolarTime(now, userLon);
            document.getElementById('solar-time').textContent = formatHMS(solarHours);

            checkSunPosition(now);
        }

        function updateAstroData() {
            const now = new Date();
            
            document.getElementById('sunrise').textContent = getSunRiseSet(now, userLat, userLon, true);
            document.getElementById('sunset').textContent = getSunRiseSet(now, userLat, userLon, false);
            
            const moonData = getMoonPhaseData(now);
            document.getElementById('moon-phase').textContent = moonData.name;

            document.getElementById('moonrise').textContent = getMoonRiseSet(now, true);
            document.getElementById('moonset').textContent = getMoonRiseSet(now, false);
        }

        setInterval(updateClocks, 1000);
        setInterval(updateAstroData, 60000);
        updateClocks();
        updateAstroData();
    </script>
</body>
</html>
